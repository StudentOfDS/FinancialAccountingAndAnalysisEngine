[project]
name = "financial-accounting-engine"
version = "1.0.0"
description = "Financial Accounting, Analysis, Visualization, and Forecasting Intelligence System"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "pydantic>=2.0", "streamlit>=1.30", "plotly>=5.18",
  "openpyxl>=3.1", "statsmodels>=0.14", "scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7", "kaleido>=0.2"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
